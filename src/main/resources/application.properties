spring.application.name=medipanda
server.port=${PORT:8081}

# One config file for everything: defaults are for localhost, Render/Docker override them with environment variables.
# Optional: put local-only secrets in src/main/resources/application-local.properties (gitignored, loaded if present).
spring.config.import=optional:classpath:application-local.properties

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medipanda}
spring.data.mongodb.auto-index-creation=true
spring.web.resources.cache.period=${STATIC_CACHE_PERIOD:0}
app.jwt.secret=${JWT_SECRET:medipanda-super-secret-key-change-this-in-production-2026}
app.jwt.expiration-ms=86400000

server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Email OTP (Brevo HTTP API)
app.mail.brevo-enabled=${BREVO_ENABLED:false}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.brevo-sender-email=${BREVO_SENDER_EMAIL:}
app.mail.brevo-sender-name=${BREVO_SENDER_NAME:MediPanda}

# DEV ONLY: when email is not configured, print OTP codes to the server console
# instead of failing (so Forgot Password / Registration can still be tested).
app.otp.dev-console=${OTP_DEV_CONSOLE:false}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# External integrations
app.integrations.google-client-id=${GOOGLE_CLIENT_ID:}
app.integrations.sslcommerz-store-id=${SSLCOMMERZ_STORE_ID:}
app.integrations.sslcommerz-store-password=${SSLCOMMERZ_STORE_PASSWORD:}
app.integrations.sslcommerz-sandbox=${SSLCOMMERZ_SANDBOX:true}
app.integrations.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}

# Demo / admin / rider seeder (runs at startup). Disable in production.
app.demo-seed.enabled=${DEMO_SEED_ENABLED:true}
app.demo-seed.reset-passwords=${DEMO_SEED_RESET_PASSWORDS:true}

# Routing (OpenStreetMap data via OSRM; the public demo server is for light use only)
app.routing.osrm-base-url=${OSRM_BASE_URL:https://router.project-osrm.org}

# Push notifications (Firebase Cloud Messaging, HTTP v1)
app.fcm.service-account-json=${FCM_SERVICE_ACCOUNT_JSON:}
app.fcm.service-account-file=${FCM_SERVICE_ACCOUNT_FILE:}
# Firebase *web app* config as a single-line JSON + Web Push certificate key (VAPID)
app.fcm.web-config-json=${FIREBASE_WEB_CONFIG_JSON:}
app.fcm.vapid-key=${FIREBASE_VAPID_KEY:}

# SMS (Bangladesh gateway): provider = brevo (default, reuses BREVO_API_KEY) | alphasms | bulksmsbd
app.sms.enabled=${SMS_ENABLED:false}
app.sms.provider=${SMS_PROVIDER:brevo}
app.sms.api-key=${SMS_API_KEY:}
app.sms.sender-id=${SMS_SENDER_ID:MediPanda}

# Behind Render / Nginx: trust X-Forwarded-* headers, compress, shut down gracefully
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
